name: macOS

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/macOS.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/macOS.yml'

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macOS:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    - name: Build SwiftGodotKit
      run: swift build --target SwiftGodotKit -v
    - name: Run tests
      run: swift test -v
