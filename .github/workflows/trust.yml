name: trust
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  trust:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch trusted base
        run: git fetch origin main:refs/remotes/origin/main
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Setup SpecSync 5.0.1 for native lifecycle verification
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64)
              asset="specsync-macos-aarch64.tar.gz"
              checksum="5ebadc47c1b6b6d409af1b09d88d1ebc945cb11a32789f9e7b4785acfcc5246c"
              binary="specsync-macos-aarch64"
              ;;
            x86_64)
              asset="specsync-macos-x86_64.tar.gz"
              checksum="994ab5aacc1045e704bb198c1495d737149e67e8ae11af22608d8357aaaba05d"
              binary="specsync-macos-x86_64"
              ;;
            *)
              echo "::error::Unsupported macOS architecture: $(uname -m)"
              exit 1
              ;;
          esac
          install_dir="$RUNNER_TEMP/specsync-5.0.1"
          mkdir -p "$install_dir"
          curl -fsSL "https://github.com/CorvidLabs/spec-sync/releases/download/v5.0.1/$asset" \
            -o "$install_dir/$asset"
          printf '%s  %s\n' "$checksum" "$install_dir/$asset" | shasum -a 256 -c -
          tar -xzf "$install_dir/$asset" -C "$install_dir"
          mv "$install_dir/$binary" "$install_dir/specsync"
          chmod +x "$install_dir/specsync"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: CorvidLabs Trust gate
        id: trust
        uses: CorvidLabs/trust@9d32b5786d2e9e4d39fc581c0091c721ee3d4226 # v1.0.0
        with:
          range: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
